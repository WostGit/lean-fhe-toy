name: Lean FHE toy proof test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  lean-fhe-toy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Create self-contained Lean project
        run: |
          cat > lean-toolchain <<'EOF'
          leanprover/lean4:v4.30.0-rc2
          EOF

          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package «fhe-toy» where

          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @ "v4.30.0-rc2"

          lean_lib FheToy where
          lean_lib CenteredAttempt where
          EOF

          cat > FheToy.lean <<'EOF'
          import Mathlib

          def toyCipher (m r p q : Int) : Int :=
            m + 2 * r + p * q

          def toyDecryptNonCentered (c p : Int) : Int :=
            (c % p) % 2

          theorem parity_noise_vanishes
              (m r : Int)
              (hm : m = 0 ∨ m = 1) :
              (m + 2 * r) % 2 = m := by
            rcases hm with rfl | rfl
            · simp
            · omega

          theorem mod_add_multiple
              (x p q : Int)
              (hx0 : 0 <= x)
              (hxp : x < p) :
              (x + p * q) % p = x := by
            have h : (x + p * q) % p = x % p := by
              simp [Int.add_mul_emod_self_left]
            rw [h]
            exact Int.emod_eq_of_lt hx0 hxp

          theorem toy_decrypt_noncentered_correct
              (m r p q : Int)
              (hm : m = 0 ∨ m = 1)
              (hnoise_nonneg : 0 <= m + 2 * r)
              (hnoise_small : m + 2 * r < p) :
              toyDecryptNonCentered (toyCipher m r p q) p = m := by
            unfold toyDecryptNonCentered toyCipher

            have hmod :
                (m + 2 * r + p * q) % p = m + 2 * r := by
              exact mod_add_multiple
                (m + 2 * r) p q hnoise_nonneg hnoise_small

            rw [hmod]

            exact parity_noise_vanishes m r hm
          EOF

          cat > CenteredAttempt.lean <<'EOF'
          import Mathlib
          import FheToy

          def centeredMod (x p : Int) : Int :=
            let y := x % p
            if 2 * y < p then y else y - p

          def toyDecryptCentered (c p : Int) : Int :=
            centeredMod c p % 2

          theorem centered_mod_add_multiple_nonnegative
              (x p q : Int)
              (hp : 0 < p)
              (hx0 : 0 <= x)
              (hxhalf : 2 * x < p) :
              centeredMod (x + p * q) p = x := by
            unfold centeredMod

            have hxlt : x < p := by
              nlinarith

            have hmod : (x + p * q) % p = x := by
              exact mod_add_multiple x p q hx0 hxlt

            rw [hmod]

            have hbranch : 2 * x < p := hxhalf
            simp [hbranch]

          theorem toy_decrypt_centered_nonnegative_correct
              (m r p q : Int)
              (hp : 0 < p)
              (hm : m = 0 ∨ m = 1)
              (hnoise_nonneg : 0 <= m + 2 * r)
              (hnoise_half : 2 * (m + 2 * r) < p) :
              toyDecryptCentered (toyCipher m r p q) p = m := by
            unfold toyDecryptCentered toyCipher

            have hcenter :
                centeredMod (m + 2 * r + p * q) p = m + 2 * r := by
              exact centered_mod_add_multiple_nonnegative
                (m + 2 * r) p q hp hnoise_nonneg hnoise_half

            rw [hcenter]

            exact parity_noise_vanishes m r hm

          /-
          Frontier target.

          This is the real next wall: allow negative noise.

          Desired theorem shape:

          theorem centered_mod_add_multiple_small
              (x p q : Int)
              (hp : 0 < p)
              (hxlow : -(p / 2) < x)
              (hxhigh : x < p / 2) :
              centeredMod (x + p * q) p = x := by
            ...

          This needs case splitting on x < 0 vs 0 <= x, plus exact reasoning about
          Int.emod, representatives, division by 2, and branch inequalities.
          -/
          EOF

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean version
        run: |
          lean --version
          lake --version

      - name: Generate Lake manifest
        run: |
          lake update

      - name: Download Mathlib cache
        run: |
          lake exe cache get

      - name: Check baseline non-centered proof
        id: baseline
        continue-on-error: true
        run: |
          set +e
          lake env lean FheToy.lean > baseline-output.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Baseline Lean exit status: $status"
          echo "----- BEGIN baseline-output.log -----"
          cat baseline-output.log
          echo "----- END baseline-output.log -----"
          exit 0

      - name: Check centered attempt
        id: centered
        continue-on-error: true
        run: |
          set +e
          lake env lean CenteredAttempt.lean > centered-output.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Centered Lean exit status: $status"
          echo "----- BEGIN centered-output.log -----"
          cat centered-output.log
          echo "----- END centered-output.log -----"
          exit 0

      - name: Count sorries in our proof files only
        id: sorries
        run: |
          set +e
          grep --line-number '\bsorry\b' FheToy.lean CenteredAttempt.lean > sorry-report.txt
          count=$(wc -l < sorry-report.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Sorry count in our Lean files: $count"
          echo "----- BEGIN sorry-report.txt -----"
          cat sorry-report.txt || true
          echo "----- END sorry-report.txt -----"

      - name: Write summary
        run: |
          {
            echo "## Lean FHE toy proof result"
            echo ""
            echo "- Baseline non-centered proof exit code: ${{ steps.baseline.outputs.status }}"
            echo "- Centered attempt exit code: ${{ steps.centered.outputs.status }}"
            echo "- Sorry count in our Lean files: ${{ steps.sorries.outputs.count }}"
            echo ""
            echo "### Baseline output"
            echo '```text'
            cat baseline-output.log
            echo '```'
            echo ""
            echo "### Centered attempt output"
            echo '```text'
            cat centered-output.log
            echo '```'
            echo ""
            echo "### Sorry report"
            echo '```text'
            cat sorry-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lean-fhe-toy-diagnostics
          path: |
            baseline-output.log
            centered-output.log
            sorry-report.txt
            FheToy.lean
            CenteredAttempt.lean
            lakefile.lean
            lean-toolchain
            lake-manifest.json

      - name: Fail if baseline proof did not compile
        if: steps.baseline.outputs.status != '0'
        run: |
          echo "Baseline proof failed. Full baseline-output.log:"
          echo "----------------------------------------"
          cat baseline-output.log
          echo "----------------------------------------"
          exit 1

      - name: Fail if our proof files contain sorry
        if: steps.sorries.outputs.count != '0'
        run: |
          echo "Our Lean files still contain sorry. Full sorry-report.txt:"
          echo "----------------------------------------"
          cat sorry-report.txt || true
          echo "----------------------------------------"
          exit 1
