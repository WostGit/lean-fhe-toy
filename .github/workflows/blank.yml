name: Lean FHE centered proof limit test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  lean-fhe-centered-limit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Create self-contained Lean project
        run: |
          cat > lean-toolchain <<'EOF'
          leanprover/lean4:v4.30.0-rc2
          EOF

          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package «fhe-centered-limit» where

          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @ "v4.30.0-rc2"

          lean_lib FheLimit where
          EOF

          cat > FheLimit.lean <<'EOF'
          import Mathlib

          def toyCipher (m r p q : Int) : Int :=
            m + 2 * r + p * q

          def toyDecryptNonCentered (c p : Int) : Int :=
            (c % p) % 2

          def centeredMod (x p : Int) : Int :=
            let y := x % p
            if 2 * y < p then y else y - p

          def toyDecryptCentered (c p : Int) : Int :=
            centeredMod c p % 2

          theorem parity_noise_vanishes
              (m r : Int)
              (hm : m = 0 ∨ m = 1) :
              (m + 2 * r) % 2 = m := by
            rcases hm with rfl | rfl
            · simp
            · omega

          theorem mod_add_multiple
              (x p q : Int)
              (hx0 : 0 <= x)
              (hxp : x < p) :
              (x + p * q) % p = x := by
            have h : (x + p * q) % p = x % p := by
              simp [Int.add_mul_emod_self_left]
            rw [h]
            exact Int.emod_eq_of_lt hx0 hxp

          theorem toy_decrypt_noncentered_correct
              (m r p q : Int)
              (hm : m = 0 ∨ m = 1)
              (hnoise_nonneg : 0 <= m + 2 * r)
              (hnoise_small : m + 2 * r < p) :
              toyDecryptNonCentered (toyCipher m r p q) p = m := by
            unfold toyDecryptNonCentered toyCipher

            have hmod :
                (m + 2 * r + p * q) % p = m + 2 * r := by
              exact mod_add_multiple
                (m + 2 * r) p q hnoise_nonneg hnoise_small

            rw [hmod]

            exact parity_noise_vanishes m r hm

          theorem centered_mod_add_multiple_nonnegative
              (x p q : Int)
              (hx0 : 0 < p)
              (hxn : 0 <= x)
              (hxhalf : 2 * x < p) :
              centeredMod (x + p * q) p = x := by
            unfold centeredMod

            have hxlt : x < p := by
              omega

            have hmod : (x + p * q) % p = x := by
              exact mod_add_multiple x p q hxn hxlt

            rw [hmod]

            have hbranch : 2 * x < p := hxhalf
            simp [hbranch]

          theorem toy_decrypt_centered_nonnegative_correct
              (m r p q : Int)
              (hp : 0 < p)
              (hm : m = 0 ∨ m = 1)
              (hnoise_nonneg : 0 <= m + 2 * r)
              (hnoise_half : 2 * (m + 2 * r) < p) :
              toyDecryptCentered (toyCipher m r p q) p = m := by
            unfold toyDecryptCentered toyCipher

            have hcenter :
                centeredMod (m + 2 * r + p * q) p = m + 2 * r := by
              exact centered_mod_add_multiple_nonnegative
                (m + 2 * r) p q hp hnoise_nonneg hnoise_half

            rw [hcenter]

            exact parity_noise_vanishes m r hm

          theorem centered_mod_add_multiple_small
              (x p q : Int)
              (hp : 0 < p)
              (hxlow : -(p / 2) < x)
              (hxhigh : x < p / 2) :
              centeredMod (x + p * q) p = x := by
            by_cases hx0 : 0 <= x

            · have hxhalf : 2 * x < p := by
                omega

              exact centered_mod_add_multiple_nonnegative x p q hp hx0 hxhalf

            · have hxneg : x < 0 := by
                omega

              unfold centeredMod

              have hxplus_nonneg : 0 <= x + p := by
                omega

              have hxplus_lt : x + p < p := by
                omega

              have hsame :
                  x + p * q = (x + p) + p * (q - 1) := by
                ring

              have hmod :
                  (x + p * q) % p = x + p := by
                rw [hsame]
                exact mod_add_multiple (x + p) p (q - 1)
                  hxplus_nonneg hxplus_lt

              rw [hmod]

              have hbranch : ¬ 2 * (x + p) < p := by
                omega

              simp [hbranch]

          theorem toy_decrypt_centered_correct
              (m r p q : Int)
              (hp : 0 < p)
              (hm : m = 0 ∨ m = 1)
              (hnoise_low : -(p / 2) < m + 2 * r)
              (hnoise_high : m + 2 * r < p / 2) :
              toyDecryptCentered (toyCipher m r p q) p = m := by
            unfold toyDecryptCentered toyCipher

            have hcenter :
                centeredMod (m + 2 * r + p * q) p = m + 2 * r := by
              exact centered_mod_add_multiple_small
                (m + 2 * r) p q hp hnoise_low hnoise_high

            rw [hcenter]

            exact parity_noise_vanishes m r hm
          EOF

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean version
        run: |
          lean --version
          lake --version

      - name: Generate Lake manifest
        run: |
          lake update

      - name: Download Mathlib cache
        run: |
          lake exe cache get

      - name: Run Lean limit test
        id: lean
        continue-on-error: true
        run: |
          set +e
          lake env lean FheLimit.lean > lean-output.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Lean exit status: $status"
          echo "----- BEGIN lean-output.log -----"
          cat lean-output.log
          echo "----- END lean-output.log -----"
          exit 0

      - name: Count sorries in our proof file only
        id: sorries
        run: |
          set +e
          grep --line-number '\bsorry\b' FheLimit.lean > sorry-report.txt
          count=$(wc -l < sorry-report.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Sorry count in FheLimit.lean: $count"
          echo "----- BEGIN sorry-report.txt -----"
          cat sorry-report.txt || true
          echo "----- END sorry-report.txt -----"

      - name: Write summary
        run: |
          {
            echo "## Lean FHE centered proof limit result"
            echo ""
            echo "- Lean exit code: ${{ steps.lean.outputs.status }}"
            echo "- Sorry count in FheLimit.lean: ${{ steps.sorries.outputs.count }}"
            echo ""
            echo "### Lean output"
            echo '```text'
            cat lean-output.log
            echo '```'
            echo ""
            echo "### Sorry report"
            echo '```text'
            cat sorry-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lean-fhe-centered-limit-diagnostics
          path: |
            lean-output.log
            sorry-report.txt
            FheLimit.lean
            lakefile.lean
            lean-toolchain
            lake-manifest.json

      - name: Fail if Lean did not compile
        if: steps.lean.outputs.status != '0'
        run: |
          echo "Lean failed. Full lean-output.log:"
          echo "----------------------------------------"
          cat lean-output.log
          echo "----------------------------------------"
          exit 1

      - name: Fail if proof contains sorry
        if: steps.sorries.outputs.count != '0'
        run: |
          echo "FheLimit.lean still contains sorry. Full sorry-report.txt:"
          echo "----------------------------------------"
          cat sorry-report.txt || true
          echo "----------------------------------------"
          exit 1
